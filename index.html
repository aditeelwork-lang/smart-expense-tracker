<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header>
        <div>
            <h1>Smart Expense Tracker</h1>
            <p>Manage your money. Understand your spending.</p>
        </div>

        <button id="theme-toggle" type="button">🌙</button>
    </header>

    <main>

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Balance</h3>
                <p id="balance">₹0.00</p>
            </div>

            <div class="card">
                <h3>Total Income</h3>
                <p id="income" class="text-success">₹0.00</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses" class="text-danger">₹0.00</p>
            </div>

        </section>


        <!-- Transaction Area -->
        <section class="tracker-container">

            <!-- Add Transaction -->
            <div class="form-container">

                <h2>Add Transaction</h2>

                <form id="transaction-form">

                    <div class="form-control">
                        <label for="description">Description</label>

                        <input
                            type="text"
                            id="description"
                            placeholder="e.g. Grocery shopping"
                            required
                        >
                    </div>


                    <div class="form-control">
                        <label for="amount">Amount</label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="e.g. 500"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>


                    <div class="form-control">
                        <label for="type">Type</label>

                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>


                    <div class="form-control">
                        <label for="category">Category</label>

                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Education">Education</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>


                    <div class="form-control">
                        <label for="date">Date</label>

                        <input
                            type="date"
                            id="date"
                            required
                        >
                    </div>


                    <button class="btn" type="submit">
                        Add Transaction
                    </button>

                </form>

            </div>


            <!-- Transaction List -->
            <div class="list-container">

                <div class="list-header">

                    <h2>Transactions</h2>

                    <div class="filter-control">

                        <label
                            for="filter-category"
                            class="sr-only"
                        >
                            Filter by category
                        </label>

                        <select id="filter-category">

                            <option value="all">
                                All Categories
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <ul id="transaction-list" class="list"></ul>

                <p id="empty-state" class="empty-msg">
                    No transactions yet.
                </p>

            </div>

        </section>


        <!-- Charts -->
        <section class="analytics-container">

            <div class="chart-card">

                <h3>Expense Breakdown</h3>

                <div class="chart-wrapper">
                    <canvas id="category-chart"></canvas>
                </div>

            </div>


            <div class="chart-card">

                <h3>Monthly Expenses</h3>

                <div class="chart-wrapper">
                    <canvas id="monthly-chart"></canvas>
                </div>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
